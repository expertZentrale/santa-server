{% load i18n %}{# A row of the views picker (_filter_bar.html): makes it the view the list opens with #}
{% if is_default == "1" %}<span class="icon-button default-view is-default" title="{% translate 'Default view' %}" aria-label="{% blocktranslate %}{{ name }} is the default view{% endblocktranslate %}">{% include "console/icons/star.svg" %}</span>{% else %}<button class="icon-button default-view" form="default-filter-form" name="pk" value="{{ pk }}" title="{% translate 'Use as default' %}" aria-label="{% blocktranslate %}Use {{ name }} as default{% endblocktranslate %}">{% include "console/icons/star.svg" %}</button>{% endif %}
