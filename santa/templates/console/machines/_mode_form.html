{% load i18n %}<form method="post" class="stack"{% if in_drawer %} action="{{ request.get_full_path }}" hx-post="{{ request.get_full_path }}" hx-target="#drawer"{% endif %}>
  {% csrf_token %}
  <section class="card">
    {% include "console/_field.html" with field=form.client_mode_override %}
    <div data-show-when="client_mode_override">{% include "console/_field.html" with field=form.client_mode_override_until %}</div>
  </section>
  <div class="actions"><button class="button primary">{% translate "Save" %}</button>
    {% if in_drawer %}<button type="button" class="button" data-drawer-close>{% translate "Cancel" %}</button>{% else %}<a class="button" href="{% url 'console:machine' machine.pk %}">{% translate "Cancel" %}</a>{% endif %}</div>
</form>
